; Weapon balance: base weapons and their modules (Docs/LOADOUT.md, "Модули оружия").
; Read by WeaponDB. The server sends its copy to every client on join, so a match always plays the server's numbers.
; A weapons.cfg next to the game's .exe replaces this one (balance without a new build).
;
; [<weapon>]                     base numbers of a weapon (its id in WeaponDB: model, sight points, hands - in code)
; [<weapon>.<slot>.<module>]     a module; slots: barrel, suppressor, conversion, stock, mag, grip, muzzle, sight, ammo,
;                                akimbo
;   name, info                   shown in the build editor (a weapon's too)
;   requires                     another module that must be in the build ("stock.folded")
;   excludes                     slots that stay at their defaults while this module is in ("muzzle", "mag,ammo")
;   hidden = true                kept for later, not offered: the build editor does not list it, a build goes without
;   <key> = value                replaces the base value
;   <key>_mult = x               multiplies it (an array: every element)
;   <key>_add = x                adds to it (after the modules before it: a suppressor on top of the caliber's sound)
;   The first module of a slot is the one a build gets by default: it must change nothing.
;   Everybody can change a kit's modules (owner, 2026-11-09).
; [kit.<id>]                     a kit (Docs/LOADOUT.md, "Комплектации"): what players pick - the weapons above stay
;                                under the hood. In this order in the build editor.
;   name                         shown in the editor
;   weapon                       a weapon above
;   modules                      its modules, without the weapon's prefix (["sight.kobra", "mag.rpk40"]); the other
;                                slots have their defaults
;   The calibers are gone from the editor - each gun has its base one; a subsonic round comes only on the card
;   (Docs/CALIBERS.md keeps the dropped ones). No barrel modules either (owner, 2026-10-23): each gun has its
;   barrel - the AK 415 mm, the ACR 14.5", the Luger 200 mm; but the AUG (owner, 2026-11-02: one body, the rest is the
;   barrel - 508 or 350 mm) and the M16A1 (the 603's 20" or the 653's 14.5").
;
; Keys (units):
;   damage                 per hit, body; head x head_mult
;   pellets                hits per shot
;   pellet_spread          degrees: the pellets' cone round where the shot goes (the choke's pattern; spread_* moves
;                          the whole pattern). 0: every pellet spreads by spread_* on its own
;   fire_rate              rounds per minute
;   automatic              true / false
;   fire_rate_max          rounds per minute the rate climbs to while the trigger is held (needs fire_ramp)
;   fire_ramp              s of fire in a burst to get from fire_rate to fire_rate_max (0: no ramp)
;   mag_size, reserve_start, reserve_max     rounds
;   reload_time, equip_time, ads_time        s
;   reload_single          true: reload_time loads one round, it goes on to full, a shot stops it (a tube magazine)
;   ads_zoom               field of view x this while aiming (0.75 = iron sights)
;   move_speed             walk, sprint and crouch speed x this with the weapon in hand (by its loaded weight:
;                          1 - 0.025 a kg over 1 kg)
;   ads_move               move speed x this while aiming (on top of move_speed)
;                          A sight (owner, 2026-11-05: any optic moves worse than iron sights): move_speed x0.97 a red
;                          dot, x0.95 a magnifying scope, by the weapon on irons.
;   spread_hip, spread_ads, spread_move, spread_air      cone half angle, degrees (move: added at walking speed)
;   recoil_up              view kick up per shot, degrees
;   recoil_side            random sideways kick per shot, +- degrees
;   recoil_recover         degrees per second back to centre when not firing
;   range                  m, a shot ends there
;   falloff_ranges         m: beyond each of them the damage drops...
;   falloff_mults          ...to this share of `damage` (same count)
;   loudness               dB added to the shot sound (others hear it)
;   muzzle_flash           true / false: flash and light at the muzzle
;   tracer                 true / false: other players see the bullet's trail
;   head_mult              damage x this on a head hit (default NetWorld.HEAD_DAMAGE_MULT, 1.15; 1: as the body)
;   regen_block            s a hit keeps the victim's health from coming back (default 0: their own delay, 3 s)
;   akimbo                 true / false: a copy of the gun in the left hand (Docs/LOADOUT.md, "Акимбо"): one magazine,
;                          never reloaded - thrown away once empty; the aim button fires it, no sights meanwhile
;   akimbo_spread          spread_hip x this while the left gun is in (thrown away: the gun's own again)
;
; [grenade]                      the grenade, one a life for everybody (Docs/LOADOUT.md, "Граната"; WeaponDB.grenade).
;                                Starting numbers (owner, 2026-11-02), to be tuned by playtests:
;   speed                  m/s out of the hand (plus the player's own velocity)
;   loft                   degrees the throw goes above the view
;   fuse                   s from the launch to the blast (it bounces meanwhile)
;   bounce                 share of the speed into a surface it keeps, bouncing off
;   friction               share of the speed along a surface it keeps at a bounce
;   direct_damage          a hit on a player before the first bounce
;   blast_damage           the blast, up to blast_full m from the body (or head)...
;   blast_full, blast_radius   ...then down to 0 at blast_radius m; only bodies the blast sees (no walls between)

[grenade]
