; ====================================================================================================================
; Armsel Striker (Docs/LOADOUT.md, "Armsel Striker"), 12 gauge 2 3/4" 00 buck from a 12" barrel, a 12-round drum.
; As the real one but the reload (owner, 2026-11-07): no winding - a shell at a time through the gate on the right
; (reload_single, a shot stops it), the drum clicks round by itself; the hull flies out after every shot (as the
; Protecta's). Double action: as fast as the trigger goes (the Mk 14's cap). My numbers, not played: the Winchester's
; buckshot from a barrel 10" shorter - ~10% slower, 12 a pellet (9 x 12 = 108 of 150: two shots to 21 m), the pattern
; a little wider; ~4.2 kg empty + 12 shells - speed x0.91. The aim spread is the Winchester's (hip 1.5, moving 1.1:
; the pattern goes where the crosshair is); the kick 5.5 - more than the Winchester's (owner, 2026-11-12, to be played), so
; a second shot as fast as the trigger goes flies over the head past ~8 m from the hip - pull down or close in.

[striker]
name = "Striker"
info = "Armsel Striker, 12 калибр, картечь 00: 9 дробин по 12, ствол 12\" — слабее Winchester, сноп шире; до 21 м убивает двумя. Барабан на 12, самовзвод — стреляет, как быстро жмёшь. Заряжается по одному через окно справа, выстрел прерывает зарядку. Тяжёлый."
