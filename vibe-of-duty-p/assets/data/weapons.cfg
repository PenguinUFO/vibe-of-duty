; Weapon balance: base weapons and their modules (Docs/LOADOUT.md, "Модули оружия").
; Read by WeaponDB. The server sends its copy to every client on join, so a match always plays the server's numbers.
; A weapons.cfg next to the game's .exe replaces this one (balance without a new build).
;
; [<weapon>]                     base numbers of a weapon (its id in WeaponDB: model, sight points, hands - in code)
; [<weapon>.<slot>.<module>]     a module; slots: suppressor, conversion, stock, mag, grip, muzzle, sight, ammo
;   name, info                   shown in the build editor (a weapon's too)
;   cost                         tokens (PartDB.BUDGET per build, shared with organs)
;   requires                     another module that must be in the build ("stock.folded")
;   excludes                     slots that stay at their defaults while this module is in ("muzzle", "mag,ammo")
;   <key> = value                replaces the base value
;   <key>_mult = x               multiplies it (an array: every element)
;   <key>_add = x                adds to it (after the modules before it: a suppressor on top of the caliber's sound)
;   The first module of a slot is the one a build gets by default: it must cost 0 and change nothing.
;   "suppressor", "conversion" and "stock" are cards, not lists (owner, 2026-10-23, as Black Ops 2's attachments): the
;   build editor shows the slot's second module as a card that goes on and off; the first is "off". A stock card:
;   PH IDW, ACR and MP7 fold it, the Luger puts the board on; the AK has none. "mag" too: the next size up where there
;   is one (owner, 2026-10-23) - the AK's RPK 40, the ACR's PMAG 40, the Luger's TM08 snail; the PH IDW and the MP7
;   (40 already) have none. The calibers are gone from the editor - each
;   gun has its base one; a subsonic round comes only on the card (Docs/CALIBERS.md keeps the dropped ones). No barrel
;   modules either (owner, 2026-10-23): each gun has its barrel - the AK 415 mm, the ACR 14.5", the Luger 200 mm.
;
; Keys (units):
;   damage                 per hit, body; head x NetWorld.HEAD_DAMAGE_MULT
;   pellets                hits per shot
;   fire_rate              rounds per minute
;   automatic              true / false
;   fire_rate_max          rounds per minute the rate climbs to while the trigger is held (needs fire_ramp)
;   fire_ramp              s of fire in a burst to get from fire_rate to fire_rate_max (0: no ramp)
;   mag_size, reserve_start, reserve_max     rounds
;   reload_time, equip_time, ads_time        s
;   ads_zoom               field of view x this while aiming (0.75 = iron sights)
;   move_speed             walk, sprint and crouch speed x this with the weapon in hand (by its loaded weight:
;                          1 - 0.025 a kg over 1 kg)
;   ads_move               move speed x this while aiming (on top of move_speed)
;   spread_hip, spread_ads, spread_move, spread_air      cone half angle, degrees (move: added at walking speed)
;   recoil_up              view kick up per shot, degrees
;   recoil_side            random sideways kick per shot, +- degrees
;   recoil_recover         degrees per second back to centre when not firing
;   range                  m, a shot ends there
;   falloff_ranges         m: beyond each of them the damage drops...
;   falloff_mults          ...to this share of `damage` (same count)
;   penetration            m of cover a bullet goes through (only cover marked penetrable: Block.penetrable)
;   penetration_damage     damage x this after going through
;   loudness               dB added to the shot sound (others hear it)
;   muzzle_flash           true / false: flash and light at the muzzle
;   tracer                 true / false: other players see the bullet's trail
;   armor_piercing         true / false: the body parts' protection (damage and head-hit reductions) does not hold it

