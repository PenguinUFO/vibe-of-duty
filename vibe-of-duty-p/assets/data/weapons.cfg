pellets = 1
fire_rate = 600.0
automatic = true
mag_size = 30
reserve_start = 120
reserve_max = 180
reload_time = 2.4
equip_time = 0.45
ads_time = 0.22
ads_zoom = 0.75
ads_move = 0.7
; loaded weight: AKM 3.1 kg + a loaded magazine 0.8
move_speed = 0.93
spread_hip = 2.2
spread_ads = 0.25
spread_move = 1.5
spread_air = 3.0
recoil_up = 0.54
recoil_side = 0.086
recoil_recover = 45.8
